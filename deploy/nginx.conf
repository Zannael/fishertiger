server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API accepts uploads up to 50 MB; leave headroom for the multipart framing.
    client_max_body_size 60m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain;

    # Single-page app: unknown paths must fall back to the shell, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generating a dataset runs the whole pandas pipeline and a simulation can
        # take minutes; the default 60s timeout would abort them mid-flight.
        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
}
